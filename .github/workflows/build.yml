name:  Build Chocofi
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    uses: ./.github/workflows/main.yml
    with:
      keyboard: '["crkbd/rev1"]'
      alphas: '["QWERTY"]'
      nav: '["invertedT"]'
      clipboard: '["Win"]'
